
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LearnMate - AI Assistant</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 850px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */

        .header {
            background: #273c75;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 22px;
        }

        .header p {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.8;
        }

        .new-chat {
            background: white;
            color: #273c75;
            border: none;
            padding: 10px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        /* Chat messages */

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            align-self: flex-end;
            background: #273c75;
            color: white;
        }

        .assistant {
            align-self: flex-start;
            background: #edf0f5;
            color: #222;
        }

        .error {
            align-self: flex-start;
            background: #ffe5e5;
            color: #a00000;
        }

        .typing {
            color: #777;
            font-size: 13px;
            padding: 5px 20px;
        }

        /* Input area */

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        textarea {
            flex: 1;
            resize: none;
            height: 48px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        textarea:focus {
            border-color: #273c75;
        }

        #send-btn {
            background: #273c75;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 22px;
            cursor: pointer;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media(max-width: 600px) {

            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }

        }

    </style>

</head>

<body>

    <div class="chat-container">

        <div class="header">

            <div>
                <h2>LearnMate</h2>
                <p>Your AI Learning Assistant</p>
            </div>

            <button class="new-chat" onclick="newConversation()">
                + New Chat
            </button>

        </div>


        <div class="chat-box" id="chat-box">

            <div class="message assistant">
                Hello! I'm LearnMate.
                Ask me anything about programming,
                AI or technology.
            </div>

        </div>

        <div class="typing" id="typing"></div>


        <div class="input-area">

            <textarea
                id="user-input"
                placeholder="Type your message..."
            ></textarea>

            <button id="send-btn" onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>


    <script>

        const chatBox = document.getElementById("chat-box");
        const input = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const typing = document.getElementById("typing");

        // Maintain conversation ID
        let conversationId =
            localStorage.getItem("learnmate_id");

        if (!conversationId) {
            conversationId = crypto.randomUUID();

            localStorage.setItem(
                "learnmate_id",
                conversationId
            );
        }


        // Display messages safely
        function addMessage(text, role) {

            const message = document.createElement("div");

            message.classList.add("message", role);

            message.textContent = text;

            chatBox.appendChild(message);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        // Load previous conversation
        async function loadHistory() {

            try {

                const response = await fetch(
                    `/history/${encodeURIComponent(conversationId)}`
                );

                if (!response.ok) {
                    throw new Error("Could not load history");
                }

                const data = await response.json();

                if (data.messages.length > 0) {

                    chatBox.innerHTML = "";

                    data.messages.forEach(message => {

                        addMessage(
                            message.content,
                            message.role === "user"
                                ? "user"
                                : "assistant"
                        );

                    });

                }

            } catch (error) {

                console.error(error);

            }

        }


        // Send message to backend
        async function sendMessage() {

            const message = input.value.trim();

            if (!message || sendBtn.disabled) {
                return;
            }

            addMessage(message, "user");

            input.value = "";

            sendBtn.disabled = true;

            typing.textContent = "LearnMate is thinking...";

            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        conversation_id: conversationId,

                        message: message

                    })

                });


                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.detail || "Something went wrong"
                    );

                }

                addMessage(data.reply, "assistant");

            }

            catch (error) {

                addMessage(
                    error.message || "Unable to connect to the server.",
                    "error"
                );

            }

            finally {

                typing.textContent = "";

                sendBtn.disabled = false;

                input.focus();

            }

        }


        // Start a new conversation
        function newConversation() {

            conversationId = crypto.randomUUID();

            localStorage.setItem(
                "learnmate_id",
                conversationId
            );

            chatBox.innerHTML = "";

            addMessage(
                "Hello! I'm LearnMate. How can I help you?",
                "assistant"
            );

        }


        // Enter to send, Shift + Enter for a new line
        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter" && !event.shiftKey) {

                event.preventDefault();

                sendMessage();

            }

        });


        // Load history when page opens
        loadHistory();

    </script>

</body>

</html>
